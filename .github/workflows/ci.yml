
name: CI Pipeline

on:
  push:
    branches: [ "main", "lab6-github-actions" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display success message
        run: echo "GitHub Actions CI pipeline is running successfully!"
